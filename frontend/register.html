<!DOCTYPE html>
<html lang="en" ng-app="seatSyncApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — SeatSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-controller="AuthController">
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">SeatSync</a>
      <nav class="nav"><a href="/login.html">Sign in</a></nav>
    </div>
  </header>

  <main class="container page">
    <div class="card form-card">
      <h1>Create an account</h1>
      <p class="muted">Register with your college details to book desks.</p>

      <div class="alert alert-error" ng-if="errorMessage">{{ errorMessage }}</div>

      <form ng-submit="submitRegister(registerForm.$valid)" name="registerForm">
        <div class="form-group">
          <label for="reg-name">Full name</label>
          <input id="reg-name" type="text" ng-model="registerData.name" required>
        </div>
        <div class="form-group">
          <label for="reg-email">College email</label>
          <input id="reg-email" type="email" ng-model="registerData.email" required>
        </div>
        <div class="form-group">
          <label for="reg-sap">SAP ID</label>
          <input id="reg-sap" type="text" ng-model="registerData.studentId" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" ng-model="registerData.password" ng-minlength="6" required>
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm password</label>
          <input id="reg-confirm" type="password" ng-model="registerData.confirmPassword" required>
        </div>
        <button class="button" type="submit" ng-disabled="isLoading || registerForm.$invalid">
          {{ isLoading ? 'Creating account...' : 'Register' }}
        </button>
      </form>

      <p class="muted" style="margin-top:16px;">Already registered? <a href="/login.html">Sign in</a></p>
    </div>
  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services/api.service.js"></script>
  <script src="js/controllers/auth.controller.js"></script>
</body>
</html>
