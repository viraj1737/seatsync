<!DOCTYPE html>
<html lang="en" ng-app="seatSyncApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080A">
  <meta name="color-scheme" content="dark">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      try {
        if (localStorage.getItem('seatsync-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', '#F5F5F7');
        }
      } catch (error) {}
    })();
  </script>
  <title>Create Student Account — SeatSync</title>
  <meta name="description" content="Create your SeatSync student account to reserve study desks at UPES Central Library and track your reservations.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/premium.css">
</head>
<body ng-controller="AuthController" style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="brand-wrapper">
          <div class="brand-mark">S</div>
          <span class="brand-text">SeatSync</span>
        </a>
        <div class="nav-user-actions">
          <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme" title="Switch to light theme" aria-pressed="false">
            <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <span class="body-secondary" style="font-size: 13px;">Already have an account?</span>
          <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Register Card Form -->
  <main class="app-main auth-main">
    <div class="card auth-card" data-spotlight>
      
      <!-- Brand & Title -->
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <h1 class="page-title" style="font-size: 24px; margin-bottom: var(--space-1);">Create Student Account</h1>
        <p class="body-secondary">Register to reserve library study desks and manage bookings.</p>
      </div>

      <!-- Alerts -->
      <div class="alert alert-danger" role="alert" ng-if="errorMessage">
        <span>&times;</span>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="alert alert-success" role="status" aria-live="polite" ng-if="successMessage">
        <span>&check;</span>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Register Form with AngularJS Validation -->
      <form name="regForm" ng-submit="submitRegister(regForm.$valid)" novalidate>
        
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" 
                 id="reg-name" 
                 name="name"
                 class="form-control" 
                 placeholder="Alex Rivera" 
                 ng-model="registerData.name" 
                 required 
                 minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">University Email</label>
          <input type="email" 
                 id="reg-email" 
                 name="email"
                 class="form-control" 
                 placeholder="alex@university.edu" 
                 ng-model="registerData.email" 
                 required>
          <span class="form-hint">Used for reservation confirmations.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-studentid">
            <span>Student ID</span>
            <span class="form-label-optional">Optional</span>
          </label>
          <input type="text" 
                 id="reg-studentid" 
                 name="studentId"
                 class="form-control" 
                 placeholder="STU-2026-089" 
                 ng-model="registerData.studentId">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" 
                 id="reg-password" 
                 name="password"
                 class="form-control" 
                 placeholder="At least 6 characters" 
                 ng-model="registerData.password" 
                 required 
                 minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <input type="password" 
                 id="reg-confirm" 
                 name="confirmPassword"
                 class="form-control" 
                 placeholder="Re-enter your password" 
                 ng-model="registerData.confirmPassword" 
                 required>
        </div>

        <button type="submit" 
                class="btn btn-primary btn-block btn-lg" 
                style="margin-top: var(--space-4);"
                ng-disabled="isLoading">
          <span ng-if="!isLoading">Create Account</span>
          <span ng-if="isLoading">Creating account...</span>
        </button>

      </form>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services/api.service.js"></script>
  <script src="js/controllers/auth.controller.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/premium.js"></script>
</body>
</html>
