<!DOCTYPE html>
<html lang="en" ng-app="seatSyncApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — SeatSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-controller="AuthController">
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">SeatSync</a>
      <nav class="nav"><a href="/">Home</a></nav>
    </div>
  </header>

  <main class="container page">
    <div class="card form-card">
      <h1>Sign in</h1>
      <p class="muted">Enter your email and password to continue.</p>

      <div class="alert alert-error" ng-if="errorMessage">{{ errorMessage }}</div>

      <form ng-submit="submitLogin()" name="loginForm">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" ng-model="loginData.email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" ng-model="loginData.password" required>
        </div>
        <button class="button" type="submit" ng-disabled="isLoading || loginForm.$invalid">
          {{ isLoading ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>

      <div class="demo-row">
        <button class="button button-secondary button-small" ng-click="fillAndSubmit('viraj.29022@stu.upes.ac.in', 'Password123')">Demo student login</button>
        <button class="button button-secondary button-small" ng-click="fillAndSubmit('admin@seatsync.edu', 'Admin1234')">Demo admin login</button>
      </div>

      <p class="muted" style="margin-top:16px;">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/demo.service.js"></script>
  <script src="js/services/api.service.js"></script>
  <script src="js/controllers/auth.controller.js"></script>
</body>
</html>
