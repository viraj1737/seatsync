<!DOCTYPE html>
<html lang="en" ng-app="seatSyncApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080A">
  <meta name="color-scheme" content="dark">
  <title>Sign In — SeatSync UPES</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body ng-controller="AuthController" style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Header -->
  <header class="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="brand-wrapper">
          <div class="brand-mark">S</div>
          <span class="brand-text">SeatSync</span>
          <span class="brand-badge">UPES</span>
        </a>
        <div class="nav-user-actions">
          <span class="body-secondary" style="font-size: 13px;">New student?</span>
          <a href="/register.html" class="btn btn-secondary btn-sm">Create Account</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Login Card Form -->
  <main class="app-main" style="display: flex; align-items: center; justify-content: center; padding: var(--space-8) var(--space-4);">
    <div class="card" style="max-width: 440px; width: 100%; padding: var(--space-8); box-shadow: var(--shadow-lg);">
      
      <!-- Brand & Title -->
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <div class="brand-mark" style="width: 48px; height: 48px; font-size: 22px; margin: 0 auto var(--space-3) auto;">S</div>
        <h1 class="page-title" style="font-size: 24px; margin-bottom: var(--space-1);">Welcome to SeatSync</h1>
        <p class="body-secondary">Sign in with your university credentials to reserve a seat.</p>
      </div>

      <!-- Alerts -->
      <div class="alert alert-danger" ng-if="errorMessage">
        <span>&times;</span>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="alert alert-success" ng-if="successMessage">
        <span>&check;</span>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Login Form with Robust Submission -->
      <form name="loginForm" ng-submit="submitLogin()" novalidate>
        
        <div class="form-group">
          <label class="form-label" for="login-email">UPES Student Email</label>
          <input type="text" 
                 id="login-email" 
                 name="email"
                 class="form-control" 
                 placeholder="viraj.29022@stu.upes.ac.in" 
                 ng-model="loginData.email" 
                 autocomplete="username"
                 required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">
            <span>Password</span>
            <span class="body-secondary" style="font-size: 12px;">(Default: Password123)</span>
          </label>
          <input type="password" 
                 id="login-password" 
                 name="password"
                 class="form-control" 
                 placeholder="Enter password" 
                 ng-model="loginData.password" 
                 autocomplete="current-password"
                 required>
        </div>

        <button type="submit" 
                class="btn btn-primary btn-block btn-lg" 
                style="margin-top: var(--space-2);"
                ng-disabled="isLoading">
          <span ng-if="!isLoading">Sign In &rarr;</span>
          <span ng-if="isLoading">Verifying credentials...</span>
        </button>

      </form>

      <!-- One-Click Quick Access Shortcuts -->
      <div style="margin-top: var(--space-6); padding-top: var(--space-5); border-top: 1px solid var(--color-border-subtle); text-align: center;">
        <span class="label-meta" style="display: block; margin-bottom: var(--space-3); font-weight: 600;">One-Click Quick Access:</span>
        <div style="display: flex; flex-direction: column; gap: var(--space-2);">
          <button type="button" class="btn btn-secondary btn-sm" ng-click="fillAndSubmitViraj()" style="background: var(--color-accent-blue-subtle); border-color: var(--color-accent-blue); color: var(--color-accent-blue); font-weight: 600;">
            One-Click Sign In as Viraj Kumar (UPES Student) &rarr;
          </button>
          <button type="button" class="btn btn-secondary btn-sm" ng-click="fillAndSubmitAdmin()">
            One-Click Sign In as Library Administrator &rarr;
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services/api.service.js"></script>
  <script src="js/controllers/auth.controller.js"></script>
  <script src="js/jquery-effects.js"></script>
</body>
</html>
